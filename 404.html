<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · Irham Naufal</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-accent: #6B4EFF;
      --font-display: 'DM Serif Display', Georgia, serif;
      --font-body: 'DM Sans', -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: #FAFAFA;
      color: #1D1D1F;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .code {
      font-size: clamp(5rem, 20vw, 10rem);
      font-family: var(--font-display);
      font-style: italic;
      color: var(--color-accent);
      opacity: .15;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1rem; }
    p  { color: #86868B; margin-bottom: 2rem; }
    a  {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .85rem 1.75rem;
      border-radius: 100px;
      background: var(--color-accent);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      transition: box-shadow .2s;
    }
    a:hover { box-shadow: 0 4px 20px rgba(107,78,255,.35); }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Nothing here yet.</h1>
    <p>The page you're looking for doesn't exist — or maybe it's still being built.</p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
