<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Lost in Space · Irham Naufal</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --accent: #8B5CF6;
      --accent-bright: #A78BFA;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #05050f;
      color: #F0EEFF;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(6rem, 22vw, 12rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 40px rgba(139, 92, 246, .4));
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: .75rem;
    }

    p {
      color: #7B77A8;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .9rem 1.8rem;
      border-radius: 100px;
      background: linear-gradient(135deg, var(--accent), #6D28D9);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(139, 92, 246, .4);
      transition: box-shadow .2s, transform .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    a:hover {
      box-shadow: 0 8px 36px rgba(139, 92, 246, .6);
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
  <canvas id="spaceCanvas"></canvas>
  <div class="content">
    <div class="code">404</div>
    <h1>Lost in Space.</h1>
    <p>This page drifted into a black hole — or maybe it was never here.</p>
    <a href="/">← Back to Mission Control</a>
  </div>
  <script src="assets/js/main.js"></script>
</body>

</html>
